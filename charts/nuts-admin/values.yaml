# Default values for nuts-admin.

replicaCount: 1

image:
  repository: nutsfoundation/nuts-admin
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 1305

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /status
    port: http
readinessProbe:
  httpGet:
    path: /status
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes/volumeMounts on the output Deployment definition.
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# The Nuts node internal API this nuts-admin instance manages.
env:
  nutsNodeAddress: "http://localhost:8081"

# Rendered into config.yaml (mounted at /app/config.yaml, referenced by
# NUTS_CONFIGFILE). See deploy/config.yaml.example in the nuts-admin repo
# for the full set of options this accepts (e.g. oidc, credentialprofiles).
config: {}
