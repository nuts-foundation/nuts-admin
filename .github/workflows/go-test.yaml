name: Go

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.27' ]

    steps:
      - uses: actions/checkout@v7
      - name: Setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
      - name: Display Go version
        run: go version
      # main.go embeds web/dist/*; the frontend itself is built by the npm and Docker workflows
      - name: Create placeholder for embedded frontend
        run: mkdir -p web/dist && touch web/dist/.placeholder
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -v ./...